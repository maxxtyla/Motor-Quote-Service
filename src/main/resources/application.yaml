spring:
  application:
    name: motor-quote-service

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/cic_motor_quotes
    username: postgres
    password: ${DB_PASSWORD}      # From environment variable — never hardcode
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true               # Set to true for local dev only
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Empty for local dev; set in K8s secret
      timeout: 3000ms

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: motor-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Required for @RetryableTopic to work with manual ack
      spring.json.trusted.packages: "com.cic.motor_quote_service.*"

server:
  port: 8080

# ── CIC JWT Configuration ────────────────────────────────────────────────────
# SECURITY: JWT_SECRET must be at least 32 characters (256 bits for HS256)
# Generate with: openssl rand -hex 32
# Set in Kubernetes Secret, never in source control.
app:
  jwt:
    secret: ${JWT_SECRET}                  # REQUIRED — app won't start without this
    access-token-expiry-ms: 900000         # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.cic.motor_quote_service: INFO
    org.springframework.security: WARN    # Set to DEBUG when troubleshooting auth
    org.springframework.kafka: WARN
    org.redisson: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-no-trace}] %-5level %logger{36} - %msg%n"

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized   # Only show details to authenticated users
