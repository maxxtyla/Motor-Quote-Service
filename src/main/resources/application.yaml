spring:
  application:
    name: motor-quote-service

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/cic_motor_quotes
    username: postgres
    password: ${DB_PASSWORD}      # From environment variable — never hardcode
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate: app checks entities match your existing schema on startup
      # and fails fast if they don't. It will NEVER create or alter tables —
      # schema is owned and managed by you outside this application.
      ddl-auto: validate
    show-sql: true               # Set to true for local dev only
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Empty for local dev; set in K8s secret
      timeout: 3000ms

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: motor-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Required for @RetryableTopic to work with manual ack
      spring.json.trusted.packages: "com.cic.motor_quote_service.*"

server:
  port: 8080

# ── CIC JWT Configuration ────────────────────────────────────────────────────
# SECURITY: JWT_SECRET must be at least 32 characters (256 bits for HS256)
# Generate with: openssl rand -hex 32
# Set in Kubernetes Secret, never in source control.
app:
  jwt:
    secret: ${JWT_SECRET}                  # REQUIRED — app won't start without this
    access-token-expiry-ms: 900000         # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days

# ── M-Pesa / Daraja Configuration ────────────────────────────────────────────
#
# HOW TO GET THESE VALUES:
#   1. Register at https://developer.safaricom.co.ke
#   2. Create an app → copy Consumer Key + Consumer Secret
#   3. Shortcode   = your Paybill or Till Number
#   4. Passkey     = shown on your app's portal page under "Go Live"
#   5. CallbackUrl = must be public HTTPS; for local dev use ngrok:
#                    ngrok http 8080  →  https://<id>.ngrok-free.app
#
# SANDBOX VALUES (safe to use for local dev — not real money):
#   base-url:   https://sandbox.safaricom.co.ke
#   shortcode:  174379
#   passkey:    bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
#   Test phone: 254708374149
#
# NEVER commit real production credentials. Use env vars for all secrets.
# Set MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, MPESA_PASSKEY, MPESA_CALLBACK_URL
# in your Kubernetes Secret or docker-compose .env file.
#
mpesa:
  base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
  consumer-key: ${MPESA_CONSUMER_KEY}
  consumer-secret: ${MPESA_CONSUMER_SECRET}
  shortcode: ${MPESA_SHORTCODE:174379}
  passkey: ${MPESA_PASSKEY}
  callback-url: ${MPESA_CALLBACK_URL}        # e.g. https://abc123.ngrok-free.app/payments/mpesa/callback
  token-cache-ttl-seconds: 3500              # refresh token 99s before Safaricom's 3599s expiry

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.cic.motor_quote_service: INFO
    org.springframework.security: WARN    # Set to DEBUG when troubleshooting auth
    org.springframework.kafka: WARN
    org.redisson: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-no-trace}] %-5level %logger{36} - %msg%n"

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized   # Only show details to authenticated users